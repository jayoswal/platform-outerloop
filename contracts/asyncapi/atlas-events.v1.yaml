      name: employee.created
      payload:
        type: object
        additionalProperties: false
        required: [id, type, source, time, correlation_id, data]
        properties:
          id:
            type: string
            format: uuid
          type:
            const: employee.created
          source:
            type: string
          time:
            type: string
            format: date-time
          correlation_id:
            type: string
            format: uuid
          data:
            $ref: "../schemas/employee.created/1-1-0.json"
