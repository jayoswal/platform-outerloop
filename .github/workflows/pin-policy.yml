name: Pin policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out platform
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: platform-outerloop
      - name: Check out web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jayoswal/hrms-web
          path: hrms-web
      - name: Check out identity
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jayoswal/svc-identity
          path: svc-identity
      - name: Check out time
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jayoswal/svc-time
          path: svc-time
      - name: Check out expense
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jayoswal/svc-expense
          path: svc-expense
      - name: Check out workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jayoswal/svc-workflow
          path: svc-workflow
      - name: Validate exact pins
        run: python3 platform-outerloop/scripts/check_pins.py "$GITHUB_WORKSPACE"

