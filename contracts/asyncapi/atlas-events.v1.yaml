asyncapi: 3.0.0
info:
  title: Atlas Domain Events
  version: 1.0.0
channels:
  employeeCreated:
    address: employee.created
    messages:
      employeeCreated:
        $ref: "#/components/messages/EmployeeCreated"
  employeeUpdated:
    address: employee.updated
    messages:
      employeeUpdated:
        $ref: "#/components/messages/EmployeeUpdated"
  employeeDeactivated:
    address: employee.deactivated
    messages:
      employeeDeactivated:
        $ref: "#/components/messages/EmployeeDeactivated"
  timesheetSubmitted:
    address: timesheet.submitted
    messages:
      timesheetSubmitted:
        $ref: "#/components/messages/TimesheetSubmitted"
  expenseSubmitted:
    address: expense.submitted
    messages:
      expenseSubmitted:
        $ref: "#/components/messages/ExpenseSubmitted"
  timesheetApproved:
    address: timesheet.approved
    messages:
      timesheetApproved:
        $ref: "#/components/messages/TimesheetApproved"
  timesheetRejected:
    address: timesheet.rejected
    messages:
      timesheetRejected:
        $ref: "#/components/messages/TimesheetRejected"
  expenseApproved:
    address: expense.approved
    messages:
      expenseApproved:
        $ref: "#/components/messages/ExpenseApproved"
  expenseRejected:
    address: expense.rejected
    messages:
      expenseRejected:
        $ref: "#/components/messages/ExpenseRejected"
operations:
  receiveEmployeeCreated:
    action: receive
    channel:
      $ref: "#/channels/employeeCreated"
  receiveEmployeeUpdated:
    action: receive
    channel:
      $ref: "#/channels/employeeUpdated"
  receiveEmployeeDeactivated:
    action: receive
    channel:
      $ref: "#/channels/employeeDeactivated"
  sendTimesheetSubmitted:
    action: send
    channel:
      $ref: "#/channels/timesheetSubmitted"
  sendExpenseSubmitted:
    action: send
    channel:
      $ref: "#/channels/expenseSubmitted"
  receiveTimesheetSubmitted:
    action: receive
    channel:
      $ref: "#/channels/timesheetSubmitted"
  receiveExpenseSubmitted:
    action: receive
    channel:
      $ref: "#/channels/expenseSubmitted"
  sendTimesheetApproved:
    action: send
    channel:
      $ref: "#/channels/timesheetApproved"
  sendTimesheetRejected:
    action: send
    channel:
      $ref: "#/channels/timesheetRejected"
  sendExpenseApproved:
    action: send
    channel:
      $ref: "#/channels/expenseApproved"
  sendExpenseRejected:
    action: send
    channel:
      $ref: "#/channels/expenseRejected"
  receiveTimesheetApproved:
    action: receive
    channel:
      $ref: "#/channels/timesheetApproved"
  receiveTimesheetRejected:
    action: receive
    channel:
      $ref: "#/channels/timesheetRejected"
  receiveExpenseApproved:
