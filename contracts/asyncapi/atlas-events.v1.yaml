asyncapi: 3.0.0
info:
  title: Atlas Domain Events
  version: 1.0.0
channels:
  employeeCreated:
    address: employee.created
    messages:
      employeeCreated:
        $ref: "#/components/messages/EmployeeCreated"
  employeeUpdated:
    address: employee.updated
    messages:
      employeeUpdated:
        $ref: "#/components/messages/EmployeeUpdated"
  employeeDeactivated:
    address: employee.deactivated
    messages:
      employeeDeactivated:
        $ref: "#/components/messages/EmployeeDeactivated"
  timesheetSubmitted:
    address: timesheet.submitted
    messages:
      timesheetSubmitted:
        $ref: "#/components/messages/TimesheetSubmitted"
  expenseSubmitted:
    address: expense.submitted
    messages:
      expenseSubmitted:
        $ref: "#/components/messages/ExpenseSubmitted"
operations:
  receiveEmployeeCreated:
    action: receive
    channel:
      $ref: "#/channels/employeeCreated"
  receiveEmployeeUpdated:
    action: receive
    channel:
      $ref: "#/channels/employeeUpdated"
  receiveEmployeeDeactivated:
    action: receive
    channel:
      $ref: "#/channels/employeeDeactivated"
  sendTimesheetSubmitted:
    action: send
    channel:
      $ref: "#/channels/timesheetSubmitted"
  sendExpenseSubmitted:
    action: send
    channel:
      $ref: "#/channels/expenseSubmitted"
components:
  messages:
    EmployeeCreated:
      name: employee.created
      payload:
        type: object
        additionalProperties: false
        required: [id, type, source, time, correlation_id, data]
        properties:
          id:
            type: string
            format: uuid
          type:
            const: employee.created
          source:
            type: string
          time:
            type: string
            format: date-time
          correlation_id:
            type: string
            format: uuid
          data:
            $ref: "../schemas/employee.created/1-1-0.json"
    EmployeeUpdated:
      name: employee.updated
      payload:
        type: object
        additionalProperties: false
        required: [id, type, source, time, correlation_id, data]
        properties:
          id:
            type: string
            format: uuid
          type:
            const: employee.updated
          source:
            type: string
          time:
            type: string
            format: date-time
          correlation_id:
            type: string
            format: uuid
          data:
            $ref: "../schemas/employee.updated/1-1-0.json"
    EmployeeDeactivated:
      name: employee.deactivated
      payload:
        type: object
        additionalProperties: false
        required: [id, type, source, time, correlation_id, data]
        properties:
          id:
            type: string
            format: uuid
          type:
            const: employee.deactivated
          source:
            type: string
          time:
            type: string
            format: date-time
          correlation_id:
            type: string
            format: uuid
          data:
            $ref: "../schemas/employee.deactivated/1-0-0.json"
    TimesheetSubmitted:
      name: timesheet.submitted
      payload:
        type: object
        additionalProperties: false
        required: [id, type, source, time, correlation_id, data]
        properties:
          id:
            type: string
            format: uuid
          type:
            const: timesheet.submitted
          source:
            type: string
          time:
            type: string
            format: date-time
          correlation_id:
            type: string
            format: uuid
          data:
            $ref: "../schemas/timesheet.submitted/1-1-0.json"
    ExpenseSubmitted:
      name: expense.submitted
      payload:
        type: object
        additionalProperties: false
        required: [id, type, source, time, correlation_id, data]
        properties:
          id:
            type: string
            format: uuid
          type:
            const: expense.submitted
          source:
            type: string
          time:
            type: string
            format: date-time
          correlation_id:
            type: string
            format: uuid
          data:
            $ref: "../schemas/expense.submitted/1-2-0.json"
