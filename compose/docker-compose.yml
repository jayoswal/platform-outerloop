name: atlas

services:
  postgres:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    image: traefik:3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports: ["8080:80", "8082:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  svc-identity:
    build: ../../svc-identity
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity_db
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      PORT: "8001"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    labels:
      - traefik.enable=true
      - traefik.http.routers.identity.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/identity`)
      - traefik.http.services.identity.loadbalancer.server.port=8001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  svc-time:
    build: ../../svc-time
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/time_db
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      STANDARD_WEEK_HOURS: ${STANDARD_WEEK_HOURS}
      PORT: "8002"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    labels:
      - traefik.enable=true
      - traefik.http.routers.time.rule=PathPrefix(`/api/v1/time`)
      - traefik.http.services.time.loadbalancer.server.port=8002
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  svc-expense:
    build: ../../svc-expense
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/expense_db
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8003"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    labels:
      - traefik.enable=true
      - traefik.http.routers.expense.rule=PathPrefix(`/api/v1/expense`)
      - traefik.http.services.expense.loadbalancer.server.port=8003
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  svc-workflow:
    build: ../../svc-workflow
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/workflow_db
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      PORT: "8004"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    labels:
      - traefik.enable=true
      - traefik.http.routers.workflow.rule=PathPrefix(`/api/v1/workflow`) || PathPrefix(`/api/v1/approvals`)
      - traefik.http.services.workflow.loadbalancer.server.port=8004
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  hrms-web:
    build: ../../hrms-web
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80

  adminer:
    image: adminer:4.17.1@sha256:c1c24d89d06fcb8fc0fb5a049240dc292ff4a121ae05d7e74d64b58c421d2921
    ports: ["8081:8080"]

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata: {}
